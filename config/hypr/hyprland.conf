# Más información: https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    preserve_split = true # You probably want this
}

# Más información: https://wiki.hypr.land/Configuring/Master-Layout/
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

# XWayland sin escalado (evita apps X11 borrosas con GDK_SCALE fijo)
xwayland {
    force_zero_scaling = true
}

###############
### ENTRADA ###
###############

input {
    kb_layout = latam
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# Más información: https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Ejemplo de configuración por dispositivo
# Más información: https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


#########################
### ATAJOS DE TECLADO ###
#########################

# Más información: https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Atajos de ejemplo. Más información: https://wiki.hypr.land/Configuring/Binds/
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, [float; size 1000 500; center] $terminal

bind = $mainMod, A, exec, ~/.config/hypr/scripts/random_wallpaper.sh
bind = $mainMod SHIFT, A, exec, ~/.config/wallpaper-select/wallpaper_select.py
bind = $mainMod SHIFT, L, exec, wlogout -b 4 -m 260px
bind = $mainMod SHIFT, V, exec, ~/.config/clipboard/clipboard.py

# Selector de ventanas
bind = CTRL ALT, Tab, exec, ~/.config/window-select/window_select.py

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $terminal -e lf
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, exec, $navegador
bind = $mainMod, N, exec, swaync-client -t # swayNC panel

# Mover el foco con mainMod + flechas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Cambiar de espacio de trabajo con mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover la ventana activa a un espacio con mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Espacio de trabajo especial de ejemplo (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Recorrer los espacios existentes con mainMod + rueda del ratón
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mover/redimensionar ventanas con mainMod + clic izquierdo/derecho y arrastrar
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

######################################
### VENTANAS Y ESPACIOS DE TRABAJO ###
######################################

# Más información: https://wiki.hypr.land/Configuring/Window-Rules/
# Reglas de espacios de trabajo: https://wiki.hypr.land/Configuring/Workspace-Rules/

# Reglas de ventana de ejemplo útiles

windowrule {
    # Ignorar las peticiones de maximizar de todas las apps.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Corrige problemas al arrastrar con XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Regla para ventanas lanzadas con hyprland-run
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = nmtui-float
    match:title = ^(nmtui)$

    float = yes
    size = 850 400
    center = yes
}

windowrule {
    name = qalc-float
    match:title = ^(qalc-float)$

    float = yes
    size = 500 300
    center = yes
}

windowrule {
    name = network-panel-float
    match:class = ^(network-panel)$

    float = yes
    size = 760 520
    center = yes
}

windowrule {
    name = nyancat-float
    match:title = ^(nyancat)$

    float = yes
    size = 700 420
    center = yes
}

#########################
### AJUSTES DE EQUIPO ###
#########################

# monitores, teclas Fn/multimedia y demas ajustes propios de cada equipo
# (ver docs/PERSONALIZACION.md)
source = ~/.config/hypr/local.conf
