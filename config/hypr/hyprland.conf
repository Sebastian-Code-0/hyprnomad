#################
### MONITORES ###
#################

monitor = ,preferred,auto,auto

#####################
### MIS PROGRAMAS ###
#####################

# Programas que uso
$terminal = kitty
$fileManager = dolphin
$menu = ~/.config/launcher/launcher.py
$navegador = firefox

##################
### AUTOINICIO ###
##################

exec-once = waybar
exec-once = hypridle
exec-once = swaync
exec-once = awww-daemon
exec-once = udiskie

exec-once = ~/.config/hypr/scripts/set_wallpaper.sh
exec-once = ~/.config/hypr/scripts/battery-status.sh
exec-once = python3 ~/.config/hypr/scripts/window_thumb_daemon.py

exec-once = wl-paste --type text --watch ~/.config/clipboard/store.sh
exec-once = wl-paste --type image --watch ~/.config/clipboard/store.sh

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = /usr/lib/polkit-kde-authentication-agent-1

############################
### VARIABLES DE ENTORNO ###
############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_SCALE,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

################
### PERMISOS ###
################

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

##################
### APARIENCIA ###
##################

general {
    gaps_in = 2
    gaps_out = 6
    border_size = 1

    col.active_border = rgba(262626aa) 45deg
    col.inactive_border = rgba(111111aa)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2

    # transparencia de las ventanas
    active_opacity = 0.8
    inactive_opacity = 0.6

    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(000000b3)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
	    popups = true
	    new_optimizations = true
        noise = 0.0200
        contrast = 1
        brightness = 0.8172

        vibrancy = 0.1696
    }
}

# blur de fondo para wlogout
layerrule {
    name = wlogout_blur
    match:namespace = logout_dialog
    blur = true
    ignore_alpha = 0.5
}

layerrule {
    name = launcher_blur
    match:namespace = launcher
    blur = true
    ignore_alpha = 0.4
}

layerrule {
    name = clipboard_blur
    match:namespace = clipboard
    blur = true
    ignore_alpha = 0.4
}

layerrule {
    name = wallpaper_blur
    match:namespace = wallpaper-select
    blur = true
    ignore_alpha = 0.4
}

layerrule {
    name = window_blur
    match:namespace = window-select
    blur = true
    ignore_alpha = 0.4
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / sin espacios cuando hay una sola ventana
# descomenta todo para activarlo.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
