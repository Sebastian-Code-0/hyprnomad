# Ajustes propios de cada equipo: monitores, teclas Fn/multimedia y demas.
# hyprland.conf carga este archivo al final. Descomenta y adapta lo que necesites.
# Para ver el nombre de una tecla: wev (o hyprctl binds); de un monitor: hyprctl monitors.

# Monitores (nombre, resolucion, posicion, escala)
# monitor = HDMI-A-1, preferred, auto, 1

# Volumen y micrófono
# bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh --inc
# bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh --dec
# bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh --toggle
# bind = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume.sh --toggle-mic

# Brillo
# bind = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh --inc
# bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh --dec

# Capturas de pantalla (requiere hyprshot)
# bind = , PRINT, exec, hyprshot -m output -o "$(xdg-user-dir PICTURES)/Screenshots"

# Multimedia (requiere playerctl)
# bindl = , XF86AudioPlay, exec, playerctl play-pause
# bindl = , XF86AudioNext, exec, playerctl next
# bindl = , XF86AudioPrev, exec, playerctl previous

# Menu de apps favoritas en una tecla libre de tu teclado
# bind = , XF86Favorites, exec, ~/.config/hypr/scripts/favorites_launcher.sh

# Calculadora (requiere libqalculate)
# bind = , XF86Calculator, exec, kitty --title qalc-float -e qalc
