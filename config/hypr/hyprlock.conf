# Hyprlock: tarjeta centrada, colores de pywal

# rutas
$info   = ~/.config/hypr/hyprlock/info.sh
$avatar = ~/.config/hypr/hyprlock/assets/avatar.jpg
$wall   = ~/.cache/hyprlock/background.png

# colores base (pywal los reemplaza abajo con source)
$accent     = rgba(7aa2f7ff)
$accent_alt = rgba(bb9af7ff)
$panel      = rgba(0a0c10a6)
$panel_soft = rgba(0a0c1066)
source = ~/.cache/wal/colors-hyprlock.conf

$text     = rgba(ffffffee)
$text_dim = rgba(ffffff99)
$line     = rgba(ffffff40)
$fail     = rgba(f0645cff)
$font     = SpaceMono Nerd Font
$font_ru  = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.8, 0.25, 1
    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldColors, 1, 2, smooth
    animation = inputFieldDots, 1, 2, smooth
}

# fondo: wallpaper actual con blur y oscurecido
background {
    monitor =
    path = $wall
    color = rgba(0a0c10ff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.2
}

# fecha y hora
label {
    monitor =
    text = cmd[update:60000] $info date
    color = $text_dim
    font_family = $font
    font_size = 19
    position = 0, 339
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] $info clock 85000
    color = $text
    font_family = $font Bold
    font_size = 112
    position = 0, 254
    halign = center
    valign = center
}

# tarjeta de cristal
shape {
    monitor =
    size = 520, 390
    color = $panel
    rounding = 34
    border_size = 1
    border_color = rgba(ffffff30)
    position = 0, -35
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $avatar
    size = 150
    rounding = -1
    border_size = 0
    position = 0, 51
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:60000] $info greeting
    color = $text
    font_family = $font
    font_size = 19
    position = 0, -71
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 420, 60
    rounding = -1
    outline_thickness = 1
    outer_color = $line
    inner_color = $panel_soft
    check_color = $text_dim
    fail_color = $fail
    capslock_color = $text
    font_color = $text
    font_family = $font
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    hide_input = false
    placeholder_text = <i>Código de acceso</i>
    fail_text = <i>Código incorrecto ($ATTEMPTS)</i>
    position = 0, -142
    halign = center
    valign = center
    zindex = 2
}

# aviso de mayúsculas (solo aparece si está activado)
label {
    monitor =
    text = cmd[update:200] $info caps
    color = $text
    font_family = $font
    font_size = 13
    position = 0, -197
    halign = center
    valign = center
    zindex = 2
}

# aviso de cuenta bloqueada por intentos fallidos (tiempo restante)
label {
    monitor =
    text = cmd[update:1000] $info lock
    color = $fail
    font_family = $font
    font_size = 14
    position = 0, -197
    halign = center
    valign = center
    zindex = 2
}

# frase
label {
    monitor =
    text = Маленькие шаги — большие перемены
    color = $text_dim
    font_family = $font_ru
    font_size = 16
    position = 0, -276
    halign = center
    valign = center
}

# batería y teclado
label {
    monitor =
    text = cmd[update:30000] $info battery
    color = $text_dim
    font_family = $font
    font_size = 15
    position = 32, 28
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $text_dim
    font_family = $font
    font_size = 15
    position = -32, 28
    halign = right
    valign = bottom
}
